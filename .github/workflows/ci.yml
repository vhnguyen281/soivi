name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soivi
          POSTGRES_PASSWORD: soivi
          POSTGRES_DB: soivi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soivi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://soivi:soivi@localhost:5432/soivi
      # Fail (don't skip) the DB tests if Postgres is missing in CI.
      SOIVI_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test
