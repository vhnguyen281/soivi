<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Duyệt dữ liệu{% endblock %} · Soivi</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<header>
  <a href="/" class="brand">Soivi · duyệt</a>
  <nav><a href="/">Hàng chờ</a><a href="/vncma">VNCMA</a><a href="/funds">Quỹ</a><a href="/cards/images">Ảnh thẻ</a><a href="/audit">Nhật ký</a></nav>
  <span class="user">{{ user }}</span>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
  // Show why an action was refused (409/403) instead of failing silently.
  document.body.addEventListener("htmx:responseError", function (e) {
    var text = e.detail.xhr.responseText;
    try { text = JSON.parse(text).detail; } catch (_) {}
    alert("Không thực hiện được: " + text);
  });
</script>
</body>
</html>
