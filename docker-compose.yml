# Default (local) mode: every service uses the Postgres and MinIO below, whatever
# DATABASE_URL and S3_* say in .env. Cloud mode (`make ... CLOUD=1`) adds
# docker-compose.cloud.yml, which points them at Neon and S3 from .env instead.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes community images to Docker Hub; Chainguard builds it from source.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: create the snapshot bucket, with versioning on so files are never lost.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc version enable local/$${S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    restart: "no"

  pipeline:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network, reach services by name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - /app/.venv

  # Scheduler: runs due sources (every bank source on the 1st at 07:00 Vietnam time),
  # alerts on broken adapters and sends the daily summary.
  # Not started by `make up`: start it explicitly with `make scheduler`.
  scheduler:
    build: .
    profiles: ["scheduler"]
    restart: unless-stopped
    command: python -m pipeline schedule --loop --interval 300
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_SECURE: "false"
      PIPELINE_LOCK_FILE: /tmp/soivi-pipeline.lock
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - /app/.venv

  # Internal review app. Bound to localhost only: reach it over an SSH tunnel on a VPS.
  api:
    build: .
    restart: unless-stopped
    command: python -m api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_HOST: 0.0.0.0
      API_PORT: "8002"
      # The site forwards each visitor's IP for the report rate limit. The API
      # port is bound to 127.0.0.1, so only the site and this host can set it.
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SOIVI_API_URL: http://api:8002
      REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  review:
    build: .
    restart: unless-stopped
    command: python -m review_app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_SECURE: "false"
      REVIEW_HOST: 0.0.0.0
      REVIEW_PORT: "8001"
    ports:
      - "127.0.0.1:${REVIEW_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/.venv

volumes:
  pgdata:
  miniodata:
