[project]
name = "soivi"
version = "0.1.0"
description = "Free, community-first comparison of Vietnamese financial products."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Fetching
    "httpx>=0.27",
    "playwright>=1.47",
    # PDF + OCR
    "pdfplumber>=0.11",
    "camelot-py>=1.0",
    "pytesseract>=0.3.13",
    # Structured extraction
    "anthropic>=0.40",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # Snapshot storage (MinIO / S3)
    "minio>=7.2",
    # Scheduling
    # Review app + public API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    # Config
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "defusedxml>=0.7",
    # VNCMA (docs/vncma/spec.md): numeric work in core/cma, xlsx report
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "openpyxl>=3.1",
    # Market/macro data for VNCMA, only through pipeline/market. Not on PyPI:
    # pinned to the vnstocks.com index below. The API key comes from VNSTOCK_API_KEY
    # or `vnstock register`; never commit it.
    "vnstock==5.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12.20260906",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.uv]
package = false

# vnstocks.com's own index. `explicit` means only packages named in
# [tool.uv.sources] come from it; everything else stays on PyPI.
[[tool.uv.index]]
name = "vnstocks"
url = "https://vnstocks.com/api/packages"
explicit = true

[tool.uv.sources]
vnstock = { index = "vnstocks" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
# Bank documents use the en dash ("1 – 3 tuần"); adapters must match it exactly.
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["core", "pipeline", "review_app", "api"]
exclude = ["^migrations/", "^web/"]

[[tool.mypy.overrides]]
module = ["camelot.*", "pytesseract.*", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs the local Postgres from `make up` (skipped if unreachable)",
    "integration: needs running Postgres/MinIO (skipped in offline runs)",
    "ocr: runs Tesseract on a PDF (slow; skipped if Tesseract is missing)",
]
