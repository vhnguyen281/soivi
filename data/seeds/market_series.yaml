# VNCMA market and macro series (docs/vncma/design-market-data.md). Loaded by `make seed`.
# Each provider becomes one `source` row (kind market_data, variant = provider name).
# Series with an equal `request` share one fetch. `month_end_rule`:
#   last_on_or_before: last value on or before the period end, at most max_gap_days earlier
#                      (10 for trading-day series: Tết can close the market for 9-10 days)
#   period_value:      the provider gives one value per period (the last one wins if several)
# Only closed periods are stored. Change a series by editing it here and re-running `make seed`.
providers:
  vnstock:
    url: https://vnstocks.com/
    fetch_method: api
  hnx:
    url: https://www.hnx.vn/
    fetch_method: http
  worldbank:
    url: https://www.worldbank.org/en/research/commodity-markets
    fetch_method: http
  shiller:
    url: https://shillerdata.com/
    fetch_method: http
series:
- code: vnindex_close
  provider: vnstock
  asset_class: eq_large
  request:
    call:
    - - Market
      - []
      - {}
    - - index
      - - VNINDEX
      - {}
    - - ohlcv
      - []
      - start: '2000-01-01'
        interval: 1D
        limit: 10000
        source: vci
    date_field: time
  value_field: close
  unit: index_points
  native_frequency: daily
  period: monthly
  month_end_rule: last_on_or_before
  max_gap_days: 10
  grade: A
  active: true
  note: Price index (no dividends). From 2004-01.
