# fly.toml app configuration file generated for soivi-api-vh on 2026-11-08T10:10:52+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'soivi-api-vh'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    SLIM = '1'

[env]
  API_HOST = '0.0.0.0'
  API_PORT = '8002'
  PYTHONUNBUFFERED = '1'
  S3_SECURE = 'true'
  TRUST_PROXY_HEADERS = 'true'

[processes]
  app = 'python -m api'

[http_service]
  internal_port = 8002
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
