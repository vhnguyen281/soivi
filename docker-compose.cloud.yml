# Cloud mode: `make <target> CLOUD=1` (or `docker compose -f docker-compose.yml
# -f docker-compose.cloud.yml ...`). The pipeline, scheduler, review app and API use
# DATABASE_URL (Neon) and S3_* (AWS) from .env instead of the local Postgres and
# MinIO. The local services still start, because the tests use them.
x-cloud-db: &cloud-db
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}

x-cloud-s3: &cloud-s3
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  S3_SECURE: ${S3_SECURE:-true}

services:
  pipeline:
    environment:
      <<: [*cloud-db, *cloud-s3]
  scheduler:
    environment:
      <<: [*cloud-db, *cloud-s3]
  review:
    environment:
      <<: [*cloud-db, *cloud-s3]
  api:
    environment:
      <<: [*cloud-db, *cloud-s3]
